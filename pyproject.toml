[project]
name = "kalshi-tape"
version = "0.1.0"
description = "Order-book flight recorder, replay engine, and market maker for Kalshi"
readme = "README.md"
license = "MIT"
requires-python = ">=3.12,<3.13"
authors = [{ name = "Eric Sohel" }]
dependencies = [
  # Wire structs and the bus payload codec; several times faster than pydantic on hot paths.
  "msgspec>=0.19",
  # Dense book arrays and vectorized analysis; permitted in core modules by the layer rule.
  "numpy>=2.0",
  # Streaming compression for raw segments; ships type hints.
  "zstandard>=0.23",
  # Keyframes and baked tables.
  "pyarrow>=17",
  # REST transport; its MockTransport makes the client testable without a network.
  "httpx>=0.27",
  # WebSocket client with built-in ping/pong handling and per-message timeouts.
  "websockets>=13",
  # RSA-PSS request signing.
  "cryptography>=43",
  # The recorder's lossy, non-blocking event bus over ipc (ADR 0008, ADR 0022).
  "pyzmq>=26",
]

[project.scripts]
tape = "tape.cli:main"

[dependency-groups]
dev = [
  "ruff>=0.6",
  "mypy>=1.11",
  "pytest>=8",
  "pytest-cov>=5",
  "pytest-asyncio>=0.24",
  "hypothesis>=6.100",
  "pre-commit>=3.8",
  "pyarrow-stubs>=17",
  "pyyaml>=6",
  "types-pyyaml>=6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tape"]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests", "scripts"]

[tool.ruff.lint]
select = [
  "E", "F", "W",      # pycodestyle, pyflakes
  "I",                # isort
  "N",                # pep8-naming
  "UP",               # pyupgrade
  "B",                # bugbear
  "A",                # builtins shadowing
  "C4",               # comprehensions
  "SIM",              # simplify
  "PT",               # pytest style
  "RET",              # return rules
  "ARG",              # unused arguments
  "PL",               # pylint subset
  "RUF",              # ruff-specific
  "ANN",              # annotations
  "S",                # bandit
  "T20",              # print
  "D",                # docstrings
]
ignore = [
  "D203", "D213",     # incompatible docstring styles; we use D211/D212
  "D105", "D107",     # magic methods and __init__ need no docstring
  "PLR0913",          # argument counts are reviewed, not counted
  "ANN401",           # Any is allowed with a comment
]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "PLR2004", "ANN", "D", "ARG001", "PLR0915"]
"scripts/**" = ["T20", "D"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src", "tests", "scripts"]
warn_unreachable = true
show_error_codes = true
pretty = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
markers = [
  "integration: needs Kalshi credentials and TAPE_TEST_ENV; skipped by default",
]
asyncio_mode = "auto"

[tool.coverage.run]
source = ["tape"]
branch = true

[tool.coverage.report]
fail_under = 90
show_missing = true
exclude_also = ["if TYPE_CHECKING:", "raise NotImplementedError"]
