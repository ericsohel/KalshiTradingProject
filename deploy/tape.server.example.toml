# tape on the production host (ADR 0024). Secrets are paths, never values.
[kalshi]
env = "prod"
# A read-only key made for this host alone, so it can be revoked without touching others.
key_id = "REPLACE-WITH-THE-SERVER-READ-KEY-ID"
private_key_path = "~/.config/tape/keys/server-read.pem"
rest_timeout_s = 10

[recorder]
data_dir = "/srv/tape/data"
# The directory must exist and be writable by this user only.
bus_endpoint = "ipc:///srv/tape/run/bus.sock"
max_connections = 16
# 200 markets keep raw data near 2.4 GB/day, inside the 64 GB data disk.
book_connections = 2
group_size = 100
keyframe_interval_s = 300
audit_interval_s = 300
audit_sample = 200
# Sized for a host with 1 GB of memory.
writer_queue_max = 50000
universe_refresh_s = 300
status_interval_s = 60

[recorder.universe]
min_volume_24h = "1000.00"
max_l2_markets = 200
exclude_mve = true

# The groups of ADR 0028, applied in order at every universe refresh. Check what they choose with
# `tape universe preview --config /etc/tape/tape.toml` before restarting the recorder.
[[recorder.universe.groups]]
name = "crypto 15-minute"
series = ["KXBTC15M", "KXETH15M"]
events = 1
markets_per_event = 1

[[recorder.universe.groups]]
name = "Bitcoin hourly"
series = ["KXBTCD"]
events = 1
markets_per_event = 6

[[recorder.universe.groups]]
name = "stock indexes hourly"
series = ["KXINXU", "KXNASDAQ100U"]
events = 1
markets_per_event = 6

[[recorder.universe.groups]]
name = "economy"
series = ["KXFEDDECISION", "KXCPIYOY", "KXPAYROLLS", "KXAAAGASW"]
events = 1
markets_per_event = 6

[[recorder.universe.groups]]
name = "weather"
series = ["KXHIGHNY", "KXHIGHLAX", "KXHIGHCHI", "KXHIGHMIA"]
events = 1
markets_per_event = 6

[[recorder.universe.groups]]
name = "politics"
category = "Politics"
events = 5
markets_per_event = 1

[[recorder.universe.groups]]
name = "sports"
category = "Sports"
events = 10
markets_per_event = 1
# Games closing within two days, not season futures, whose summed volume would otherwise win.
max_hours_to_close = 48

[serve]
listen_host = "127.0.0.1"
listen_port = 8080
allowed_origins = ["https://kalshi-tape-live.northcentralus.cloudapp.azure.com", "https://ericsohel.com"]
max_clients = 200

[bake]
# An hourly timer runs `tape bake`, then `tape prune --apply` (docs/OPERATIONS.md 3).
grace_s = 600
# Raw segments stay three days after a verified bake of their hour (ADR 0025).
raw_retention_hours = 72
# Half the default, for a host with 1 GB of memory shared with the recorder: it lowers a bake's
# peak by about 60 MB at the same speed (docs/OPERATIONS.md 5).
max_part_rows = 250000
