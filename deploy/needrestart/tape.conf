# Keep automatic library upgrades from restarting the recorder and the live API: each restart
# is a gap in the tape. Security updates still install; these two services pick up upgraded
# libraries at their next deliberate restart, which every deploy performs (docs/OPERATIONS.md 3).
$nrconf{override_rc}{qr(^tape-record\.service$)} = 0;
$nrconf{override_rc}{qr(^tape-serve\.service$)} = 0;
