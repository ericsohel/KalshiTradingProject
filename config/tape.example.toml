# Example configuration for `tape`. Copy it to tape.toml (ignored by git), set key_id,
# then run `uv run tape config check --config tape.toml` before `tape record`.
# `tape serve` signs nothing: key_id and private_key_path may be left out of its
# configuration, and `tape config check --for serve` checks what it needs instead.
#
# Every setting can be overridden from the environment as TAPE_<SECTION>__<KEY>, for
# example TAPE_RECORDER__BOOK_CONNECTIONS=6 or TAPE_RECORDER__UNIVERSE__SHOWCASE_SERIES=A,B.
# Relative paths resolve against this file's directory; a leading ~ is your home.
# Secrets are never values here, only paths (docs/OPERATIONS.md 2).

[kalshi]
# "prod" or "demo". The REST and WebSocket endpoints follow from it and cannot be set
# directly. Demo and production keys are separate: use the key made for this env.
env = "prod"
key_id = "REPLACE-WITH-YOUR-READ-KEY-ID"
# The PEM Kalshi gave you, readable by you alone: chmod 600.
private_key_path = "~/.config/tape/keys/prod-read.pem"
rest_timeout_s = 10
# Every WebSocket pings every ws_ping_interval_s and is closed when no pong arrives
# within ws_ping_timeout_s; each is at most 60 (ADR 0019).
ws_ping_interval_s = 10
ws_ping_timeout_s = 20
# Only the live-only ticker connection, which always carries traffic, is also closed
# after this many seconds without a frame; quiet connections are healthy.
ws_silence_timeout_s = 60

[recorder]
data_dir = "data"
# One live-only ticker connection + one control connection + book_connections.
max_connections = 16
# Each book connection carries at most group_size (at most 500) markets in one subscription
# per channel (ADR 0020), so book_connections * group_size must cover max_l2_markets.
book_connections = 4
group_size = 500
# Whole minutes that divide an hour.
keyframe_interval_s = 300
audit_interval_s = 300
audit_sample = 200
# An audit passes when the REST book matches the local book at any state in a window that
# opens audit_lead_ms before the request and closes audit_settle_ms after the reply (ADR 0021);
# each is 1 to 5000. A market with more than audit_tap_max_events (at most 50000) book changes
# in its window is counted undecidable.
audit_lead_ms = 250
audit_settle_ms = 750
audit_tap_max_events = 5000
writer_queue_max = 200000
universe_refresh_s = 300
status_interval_s = 60
# Live consumers such as `tape serve` read every event and a refresh image of every book from
# a ZeroMQ bus (ADR 0008, ADR 0022). Unset, there is no bus. An ipc path must be absolute, at
# most 103 bytes on macOS, and in an existing directory that only this user can write, such
# as a run/ directory beside the data directory.
# bus_endpoint = "ipc:///srv/tape/run/bus.sock"
# Each book is republished once per bus_refresh_s (1 to 60), paced across the interval, so a
# consumer that lost messages or just started has every book back within that long.
bus_refresh_s = 10
# Messages queued for one slow subscriber before its copies are dropped (1000 to 100000).
bus_send_hwm = 10000

[recorder.universe]
# A fixed-point string, never a float.
min_volume_24h = "1000.00"
max_l2_markets = 2000
showcase_series = ["KXBTC15M", "KXPAYROLLS", "KXHIGHNY", "KXFEDDECISION"]
exclude_mve = true

[serve]
# `tape serve` follows the recorder's bus at recorder.bus_endpoint, which must then be set, and
# serves the live API (docs/FRONTEND.md 4) on listen_host:listen_port. In production it stays on
# localhost behind a TLS proxy.
listen_host = "127.0.0.1"
listen_port = 8080
# Exact origins (scheme://host[:port]) that CORS and the WebSocket Origin check accept.
allowed_origins = ["http://localhost:5173", "http://127.0.0.1:5173"]
# Live connections at once (1 to 1000), markets per connection (1 to 50), and messages queued
# for one connection before it is resynchronized (100 to 100000).
max_clients = 200
max_tickers_per_client = 10
client_queue_max = 5000
# Bus messages queued in the API before ZeroMQ drops its copies (1000 to 100000).
bus_receive_hwm = 10000
# Titles, categories, and price grids come from Kalshi's public endpoints, without credentials,
# at most this many requests per second (1 to 10), each result kept this many seconds (60 to 86400).
metadata_requests_per_s = 2
metadata_ttl_s = 3600

[bake]
# `tape bake` turns an hour of raw segments into Parquet tables and records it in the day's
# manifest once grace_s seconds (60 to 86400) have passed since the hour ended, so that no
# segment of it is still being written.
grace_s = 600
# `tape prune --apply` deletes an hour's raw segments only after a verified bake of it, and only
# once raw_retention_hours (24 to 8760) have passed since it ended (ADR 0025).
raw_retention_hours = 72
# Rows a bake sorts in memory at once (10000 to 50000000); lower it on a host short of memory.
max_part_rows = 500000
