# All Python hooks run through uv so pre-commit, CI, and developers use the exact
# versions pinned in uv.lock.
repos:
  - repo: local
    hooks:
      - id: ruff
        name: ruff check
        entry: uv run ruff check --fix
        language: system
        types: [python]
      - id: ruff-format
        name: ruff format
        entry: uv run ruff format
        language: system
        types: [python]
      - id: mypy
        name: mypy --strict
        entry: uv run mypy
        language: system
        pass_filenames: false
      - id: check-layers
        name: import layer rule
        entry: uv run python scripts/check_layers.py
        language: system
        pass_filenames: false
      - id: check-no-float
        name: no floats in money paths
        entry: uv run python scripts/check_no_float.py
        language: system
        pass_filenames: false
      # Web hooks run through npm so pre-commit, CI, and developers use the exact
      # versions pinned in web/package-lock.json (run `npm ci` in web/ first).
      - id: web-typecheck
        name: web typecheck
        entry: npm --prefix web run typecheck
        language: system
        files: ^web/
        pass_filenames: false
      - id: web-lint
        name: web eslint
        entry: npm --prefix web run lint
        language: system
        files: ^web/
        pass_filenames: false
      - id: web-format
        name: web prettier --check
        entry: npm --prefix web run format:check
        language: system
        files: ^web/
        pass_filenames: false
  - repo: https://github.com/Yelp/detect-secrets
    rev: v1.5.0
    hooks:
      - id: detect-secrets
        args: [--baseline, .secrets.baseline]
        exclude: ^(uv\.lock|web/package-lock\.json|specs/.*)$
